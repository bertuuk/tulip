# Settings read by deploy/deploy.sh on the server.

# WordPress install on the server.
SITE_PATH="$HOME/public_html/__DOMAIN__"

# Tulip (parent theme).
#   "latest" → latest GitHub Release; WordPress auto-updates it afterwards.
#   "vX.Y.Z" → pinned to that version, auto-updates off.
TULIP_REF="latest"

# Folder name of the child theme inside wp-content/themes.
CHILD_SLUG="__CHILD__"

# WordPress.org plugins to install and activate (slugs, space separated).
PLUGINS=""

# Own plugins published as GitHub Releases (space separated).
#   "marketing-blocks/bertuuk-marketing-blocks"         → latest release; WordPress
#                                                         auto-updates it afterwards
#   "marketing-blocks/bertuuk-marketing-blocks@v2.3.0"  → pinned to that version,
#                                                         auto-updates off
GITHUB_PLUGINS=""
